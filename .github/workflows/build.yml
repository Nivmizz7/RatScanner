name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            NuGet.Config
      - name: Agent documentation integrity
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-agent-docs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-agent-docs.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyzer gate consistency
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-analyzer-gate.ps1
      - name: RatScannerData validation tests
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-data-validation.ps1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Markdown tooling audit and lint
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint:md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore .NET tools
        run: dotnet tool restore
      - name: Restore Dependencies
        run: dotnet restore RatScanner.sln
      - name: C# formatting
        run: dotnet csharpier check .
      - name: Build
        run: dotnet build RatScanner.sln -c Release --no-restore
      - name: Build Debug (analyzer gate for #if-gated code)
        run: dotnet build RatScanner.sln -c Debug --no-restore
      - name: Test
        run: dotnet test RatScanner.sln -c Release --no-build
      - name: Dependency vulnerability audit
        run: |
          # Console output does not reliably expose severity. Parse JSON and fail on any reported vulnerability.
          # Keep stdout JSON separate from stderr diagnostics (.NET 10 list package restore noise).
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'vulnerable-packages.json'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'vulnerable-packages.err'
          $proc = Start-Process -FilePath 'dotnet' `
            -ArgumentList @('list','RatScanner.sln','package','--vulnerable','--include-transitive','--format','json') `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          if (Test-Path $stderrPath) {
            $stderrText = Get-Content -LiteralPath $stderrPath -Raw
            if (-not [string]::IsNullOrWhiteSpace($stderrText)) { Write-Host $stderrText }
          }
          $jsonText = Get-Content -LiteralPath $stdoutPath -Raw
          Write-Host $jsonText
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          $report = $jsonText | ConvertFrom-Json
          $severities = @(
            $report.projects
            | ForEach-Object { $_.frameworks }
            | ForEach-Object { $_.topLevelPackages; $_.transitivePackages }
            | Where-Object { $_ -ne $null }
            | ForEach-Object { $_.vulnerabilities }
            | Where-Object { $_ -ne $null }
            | ForEach-Object { $_.severity }
          )
          if ($severities.Count -gt 0) {
            throw ("Vulnerable package(s) detected (severity: {0}). See audit output above." -f (($severities | Select-Object -Unique) -join ', '))
          }
      - name: Publish
        run: dotnet publish src/App/RatScanner.csproj -c Release -o publish -p:PublishSingleFile=true --runtime win-x64 --self-contained true
      - name: Include LICENSE
        run: |
          if (-not (Test-Path publish/LICENSE)) { Copy-Item LICENSE publish/LICENSE -Force }
          if (-not (Test-Path publish/LICENSE)) { throw 'LICENSE is missing from publish output.' }
      - name: Include Data
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-data.ps1 -DestinationPath (Join-Path $PWD 'publish/Data') -Force
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download or validate RatScanner data.' }
      - name: Zip Content
        run: |
          & 7z a -r RatScanner.zip ./publish/*
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path RatScanner.zip)) { throw 'Failed to create RatScanner.zip.' }
      - name: Verify release package
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-package.ps1 -PackagePath (Join-Path $PWD 'RatScanner.zip')
          if ($LASTEXITCODE -ne 0) { throw 'RatScanner.zip failed release package verification.' }
      - name: Upload validated release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RatScanner.zip
          path: ./RatScanner.zip
          archive: false
          if-no-files-found: error
